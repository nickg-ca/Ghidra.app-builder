[package]
name = "ghidra-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
rmcp = { version = "1.4", features = ["server", "macros", "transport-io", "schemars"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util", "io-std", "process", "sync", "time", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = "s"
strip = true
